spring:
  application:
    name: meal-plan-service

  datasource:
    url: jdbc:postgresql://localhost:5432/meal_plan
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

app:
  jwt:
    secret: VGhpc0lzQVZlcnlMb25nU2VjcmV0S2V5Rm9yTWVhbFBsYW5BcHBsaWNhdGlvbjIwMjQ=
    expiration-ms: 86400000
  upload:
    dir: ./uploads/avatars

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
